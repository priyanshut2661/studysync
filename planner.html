```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - StudySync</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="navbar">
    <div class="logo">📚 StudySync</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="subjects.html">Subjects</a>
        <a href="communities.html">Communities</a>
        <a href="notes.html">Notes</a>
        <a href="planner.html" class="active">Planner</a>
    </nav>

    <div class="nav-buttons">
        <a href="login.html" class="btn-outline">Login</a>
        <a href="signup.html" class="btn">Sign Up</a>
    </div>
</header>


<main class="planner-page">

    <section class="page-heading">
        <h1>📅 Study Planner</h1>
        <p>Organize your study schedule and stay productive.</p>
    </section>


    <section class="planner-layout">

        <div class="planner-form">

            <h2>Add Study Task</h2>

            <label>Task Name</label>
            <input type="text" id="taskName" placeholder="e.g. Complete Python loops">

            <label>Subject</label>
            <select id="taskSubject">
                <option>Python</option>
                <option>Mathematics</option>
                <option>Physics</option>
                <option>Chemistry</option>
                <option>AI & ML</option>
                <option>DSA</option>
            </select>

            <label>Date</label>
            <input type="date" id="taskDate">

            <label>Priority</label>
            <select id="taskPriority">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
            </select>

            <button class="btn planner-add-btn" onclick="addTask()">
                + Add Task
            </button>

        </div>


        <div class="tasks-section">

            <div class="tasks-heading">
                <h2>My Tasks</h2>
                <span id="taskCount">0 Tasks</span>
            </div>

            <div id="taskList">

                <div class="empty-task">
                    <div>📝</div>
                    <h3>No tasks yet</h3>
                    <p>Add your first study task.</p>
                </div>

            </div>

        </div>

    </section>

</main>


<footer class="footer">
    <p>© 2026 StudySync. Learn. Connect. Grow.</p>
</footer>


<script>
let tasks = [];

function addTask() {

    const name = document.getElementById("taskName").value;
    const subject = document.getElementById("taskSubject").value;
    const date = document.getElementById("taskDate").value;
    const priority = document.getElementById("taskPriority").value;

    if (name.trim() === "" || date === "") {
        alert("Please enter task name and date.");
        return;
    }

    tasks.push({
        name: name,
        subject: subject,
        date: date,
        priority: priority
    });

    document.getElementById("taskName").value = "";
    document.getElementById("taskDate").value = "";

    displayTasks();
}


function displayTasks() {

    const list = document.getElementById("taskList");
    const count = document.getElementById("taskCount");

    count.innerText = tasks.length + " Tasks";

    list.innerHTML = "";

    tasks.forEach(function(task, index) {

        const div = document.createElement("div");

        div.className = "task-card";

        div.innerHTML = `
            <div>
                <h3>${task.name}</h3>
                <p>📚 ${task.subject}</p>
                <small>📅 ${task.date} &nbsp; | &nbsp; Priority: ${task.priority}</small>
            </div>

            <button class="delete-task" onclick="deleteTask(${index})">
                🗑️
            </button>
        `;

        list.appendChild(div);
    });
}


function deleteTask(index) {
    tasks.splice(index, 1);
    displayTasks();
}
</script>

</body>
</html>
